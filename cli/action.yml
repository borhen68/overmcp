name: "OverMCP Secret Guard"
description: "Block CI when leaked secrets are detected in your codebase."
branding:
  icon: "shield"
  color: "green"
inputs:
  path:
    description: "Directory to scan."
    required: false
    default: "."
  fail-on:
    description: "Fail the build at or above this severity (critical | high | medium | none)."
    required: false
    default: "high"
  include-ignored:
    description: "Also scan files normally excluded by .gitignore."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Run OverMCP scan
      shell: bash
      run: |
        EXTRA=""
        if [ "${{ inputs.include-ignored }}" = "true" ]; then
          EXTRA="--include-ignored"
        fi
        npx --yes overmcp@latest "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}" $EXTRA
